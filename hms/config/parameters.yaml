# HMS parameters
# =============
# Every tunable of the system in one readable file. The trainer reads the
# `training`, `acoustic`, `duration`, and pitch-estimation settings; synthesis
# reads `synthesis` and `pitch`. Any value here can also be overridden on the
# command line.
#
# The defaults are tuned for a *small* single-speaker corpus (a few minutes of
# sung audio, one voice).  Where a knob trades data against quality, the comment
# says which way to turn it.

acoustic:
  # Sample rate and frame rate.  44.1 kHz / 5 ms is the WORLD default and what
  # the HMM literature assumes; 22050 Hz halves the spectral dimensionality if
  # you are really short on data.
  fs: 44100
  frame_period_ms: 5.0
  # null -> whatever the vocoder backend uses (2048 at 44.1 kHz).
  fft_size: null
  # Mel-cepstral coefficients kept for the spectral envelope, *including* c0
  # (overall energy).  24-30 is the sweet spot for a compact model; higher
  # values track formants more sharply at the cost of more Gaussian parameters.
  n_mcep: 30
  # Aperiodicity bands (mel-spaced).  5 is plenty; the ear is insensitive to
  # the fine structure of aperiodicity.
  n_band: 5
  # Dynamic features.  Deltas are essentially required: without them the
  # generated trajectory is not smooth.  Delta-deltas add detail for ~2x the
  # acoustic parameters -- only enable with a larger corpus.
  use_delta: true
  use_delta2: false
  delta_window: 2
  # Analysis search range of the F0 estimator.  These are NOT a limit on what
  # may be synthesised: a score note (or an --f0-file value) outside this range
  # is rendered at the frequency it asks for, using the nearest trained
  # spectral envelope, and reported in the diagnostics.
  f0_floor: 71.0
  f0_ceil: 800.0
  f0_estimation: dio        # "dio" (fast) or "harvest" (robust, slower)
  refine_f0: true
  vocoder: auto             # auto | native | pyworld | builtin

training:
  # Per phoneme-class budgets live in phonemes.yaml, not here.
  covariance_type: diag     # "tied" shares one covariance per state (small data)
  var_floor_ratio: 0.001    # variance floor, as a fraction of the data variance
  training_method: viterbi  # "viterbi" (robust) or "baum_welch" (textbook)
  n_iterations: 5
  normalize_scale: true     # per-dimension variance normalisation of features
  min_phoneme_frames: 20    # below this a phoneme is left to the backoff model
  allow_skip: false         # s_i -> s_i+2 transitions
  default_note: 60.0        # MIDI note assumed for segments without one
  time_unit: seconds        # how to read the label file's time columns
  seed: 0

context:
  # Optional sparse phoneme-context modelling (off by default; enable with
  # `hms train --context`). Only contexts OBSERVED in the corpus are modelled
  # -- never a full triphone inventory. Each context HMM is trained directly
  # from the pooled raw feature sequences of its occurrences, and resolution
  # falls back: exact triphone -> best-supported one-sided diphone (ties go
  # left) -> dedicated phone HMM -> phone-class backoff -> optional global
  # backoff. Utterance edges use the ordinary `sil` symbol, no BOS/EOS.
  enabled: false
  min_frames: 100           # minimum pooled frames for a context HMM
  min_occurrences: 3        # minimum occurrences for a context HMM
  max_models: 64            # cap on context HMMs (best-supported are kept)
  partial: true             # also train left/right one-sided diphone contexts
  global_backoff: false     # train a pooled catch-all backoff HMM

pitch_conditioning:
  # EXPERIMENTAL optional tier, off by default (enable with
  # `hms train --pitch-conditioning`). When enabled the acoustic HMMs are
  # additionally split by the pitch bin of the note each observation was sung
  # on, so a phone can be rendered from the spectral distribution learned in
  # that pitch region instead of one averaged over the voice's whole range.
  #
  # What it does NOT do: F0 still comes from the score -- this is model
  # *selection*, never a second pitch predictor -- and the feature layout,
  # normalisation, MLPG, the vocoder and the vibrato/deviation options are all
  # untouched.
  #
  # A bin is floor(MIDI note / bin_size), computed in exact integer arithmetic,
  # so equal notes always share a bin and boundaries are deterministic: with
  # bin_size 6 (a tritone) MIDI 60-65 is bin 10 and MIDI 66-71 is bin 11.
  # Segments with no scored note (silence, rests, unvoiced-only spans) carry no
  # condition, and the inventory's silence phone is never conditioned.
  #
  # Conditioning makes data sparse: a bucket only becomes a model when it clears
  # the same support thresholds as the tier it conditions
  # (training.min_phoneme_frames for a phone, context.min_frames and
  # context.min_occurrences for a trained context). Missing buckets are not an
  # error -- synthesis prefers a pitch-conditioned model when one exists and
  # otherwise falls back through the ordinary hierarchy (exact context ->
  # partial context -> phone -> class backoff -> global backoff), and says how
  # many frames took each path. This is an experimental modelling option to
  # evaluate on your own corpus, not a claim of better audio.
  enabled: false
  bin_size: 6               # semitones per pitch bin (whole number, 1-128)

synthesis:
  # Scales the *delta* (dynamic) variances.  >1 trusts the deltas less, so the
  # trajectory follows the frame-by-frame means more literally (livelier, more
  # detail); <1 trusts them more, which flattens/smooths the trajectory.  1.0
  # reproduces the model exactly.
  variance_scale: 1.0
  pitch_variation: 1.0      # scale of the learned deviation from the note
  # Target F0 comes from score notes by default; learned pitch deviations are optional.
  f0_source: score          # score | acoustic | state_means
  duration_mode: score      # score | model
  mixture: dominant         # dominant | marginal
  pitch_smoothing: 0        # frames of moving average on F0 (0 = off)
  transpose: 0.0            # semitones
  seed: null

pitch:
  # Vibrato is a separate, controllable component -- the HMM cannot reproduce
  # fast oscillation because MLPG smooths it away.
  vibrato:
    enabled: false
    rate_hz: 5.5
    depth_semitones: 0.6
    delay_ms: 120.0
    attack_ms: 80.0
    randomness: 0.15
    waveform: sine          # sine | triangle
  # Estimate vibrato rate/depth from training data instead of the values above.
  vibrato_estimate_from_data: true

duration:
  variance_scale: 1.0       # >1 adds timing variation when predicting durations

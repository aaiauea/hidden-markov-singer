name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} (builtin vocoder)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Keep CI independent of optional C++ WORLD / pyworld installations.
      # Native-backend contract tests skip when WORLD is not present; the
      # end-to-end suite exercises the always-available numpy backend.
      HMS_NO_AUTO_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install HMS and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest
